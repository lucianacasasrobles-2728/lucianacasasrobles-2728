
name: Update My Dragonfly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-dragonfly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate dragonfly animation
        run: python scripts/update_dragonfly.py

      - name: Save updated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dragonfly_wings.gif
          if ! git diff --cached --quiet; then
            git commit -m "Update dragonfly animation"
            git push
          fi
